<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO設定 -->
    <title>お問い合わせ完了 | 株式会社Rinklogy</title>
    <meta name="robots" content="noindex" />
    <!-- サンクスページは検索結果に出さないのが一般的です -->
    <meta
      name="description"
      content="株式会社Rinklogyへのお問い合わせが完了しました。"
    />

    <!-- ドメイン確認後修正 -->
    <link rel="canonical" href="https://example.com/thanks/" />
    <meta property="og:site_name" content="株式会社Rinklogy" />
    <meta property="og:title" content="お問い合わせ完了 | 株式会社Rinklogy" />
    <meta property="og:url" content="https://example.com/thanks/" />
    <meta property="og:type" content="article" />
    <meta
      property="og:image"
      content="https://example.com/assets/images/common/ogp.jpg"
    />
    <meta name="twitter:card" content="button_large_image" />

    <!-- ファビコン -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- CSS / JS の読み込み -->
    <link rel="stylesheet" href="/assets/css/main.css" />
    <script src="/assets/main.js" defer></script>
  </head>
  <body>
    <!-- ========================================
         HEADER (共通)
    ======================================== -->
    <header
      class="l-header"
      itemscope
      itemtype="http://schema.org/LocalBusiness"
    >
      <div class="l-header__inner">
        <h1 class="l-header__logo">
          <a href="/" itemprop="url">
            <img
              src="/assets/images/logo.svg"
              alt="株式会社Rinklogy"
              width="150"
              height="45"
              decoding="async"
              itemprop="logo"
            />
          </a>
        </h1>

        <nav class="l-header__nav" aria-label="PC用グローバルナビゲーション">
          <ul class="c-gnav">
            <li class="c-gnav__item"><a href="/about.html">会社案内</a></li>
            <li class="c-gnav__item"><a href="/service.html">サービス</a></li>
            <li class="c-gnav__item">
              <a href="/flow.html">ご相談から解決まで</a>
            </li>
          </ul>
          <div class="l-header__cta">
            <a href="/contact.html" class="c-btn c-btn--primary c-btn--small"
              >お問い合わせ</a
            >
          </div>
        </nav>

        <button
          type="button"
          class="c-hamburger js-hamburger"
          aria-controls="global-nav"
          aria-expanded="false"
          aria-label="メニューを開く"
        >
          <span class="c-hamburger__line"></span>
          <span class="c-hamburger__line"></span>
          <span class="c-hamburger__line"></span>
        </button>
      </div>

      <nav id="global-nav" class="l-drawer js-drawer" aria-hidden="true">
        <div class="l-drawer__inner">
          <ul class="c-gnav">
            <li class="c-gnav__item"><a href="/about.html">会社案内</a></li>
            <li class="c-gnav__item"><a href="/service.html">サービス</a></li>
            <li class="c-gnav__item">
              <a href="/flow.html">ご相談から解決まで</a>
            </li>
          </ul>
          <div class="l-drawer__cta">
            <a href="/contact.html" class="c-btn c-btn--primary"
              >お問い合わせ</a
            >
          </div>
        </div>
      </nav>
      <div class="l-overlay js-overlay"></div>
    </header>

    <main class="l-main">
      <!-- ========================================
           サンクスページ用コンテンツ (p-contact-thanks)
      ======================================== -->
      <section class="l-section p-contact-thanks">
        <div class="l-inner p-contact-thanks__inner">
          <!-- タイトルエリア -->
          <h1 class="p-contact-thanks__title">
            <span class="p-contact-thanks__title-en">CONTACT</span>
            <span class="p-contact-thanks__title-ja"
              >お問い合わせありがとうございます</span
            >
          </h1>

          <!-- メッセージエリア -->
          <div class="p-contact-thanks__message">
            <p class="p-contact-thanks__text">
              お問い合わせを受け付けました。<br />
              内容を確認のうえ、担当者よりご連絡いたします。
            </p>
          </div>

          <!-- ボタンエリア -->
          <div class="p-contact-thanks__btn-wrap">
            <!-- 共通の c-btn を使いますが、矢印が不要な場合はCSSで対応するかモディファイアを付けます -->
            <a href="/" class="c-btn c-btn--no-arrow">トップページへ戻る</a>
          </div>
        </div>
      </section>
    </main>

    <!-- ========================================
         FOOTER (共通)
    ======================================== -->
    <footer class="l-footer">
      <div class="l-footer__inner">
        <div class="l-footer__info">
          <h2 class="l-footer__logo">株式会社 Rinklogy</h2>
          <p class="l-footer__desc">
            経営課題を整理し、ITで解決を支援するパートナー
          </p>
        </div>

        <nav class="l-footer__nav" aria-label="フッターナビゲーション">
          <ul class="l-footer__list">
            <li class="l-footer__item"><a href="/about.html">会社案内</a></li>
            <li class="l-footer__item"><a href="/service.html">サービス</a></li>
            <li class="l-footer__item">
              <a href="/flow.html">ご相談から解決まで</a>
            </li>
            <li class="l-footer__item">
              <a href="/contact.html">お問い合わせ</a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="l-footer__copyright">
        <small>© 2026 Rinklogy Inc. All Rights Reserved.</small>
      </div>
    </footer>
  </body>
</html>
